const { projects, categories } = catalog;
const PAGE_SIZE = 48;
const state = { category:'all', visible:PAGE_SIZE };
const els = Object.fromEntries(['grid','empty','load-more','category-nav','mobile-toggle'].map(id => [id, document.getElementById(id)]));

const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const formatStars = value => `${(value / 1000).toFixed(1).replace(/\.0$/, '')}K`;
const formatDate = value => new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
const categoryCount = key => key === 'all' ? projects.length : projects.filter(project => project.category === key).length;

function initialize() {
  renderNavigation();
  bindEvents();
  render();
}

function renderNavigation() {
  const groups = [...new Set(categories.map(category => category.group))];
  const allButton = `<div class="nav-group"><p class="nav-label">总览</p><button class="nav-item active" data-category="all"><span class="nav-icon">ALL</span><span class="nav-name">全部项目</span><span class="nav-count">${projects.length}</span></button></div>`;
  els['category-nav'].innerHTML = allButton + groups.map(group => `<div class="nav-group"><p class="nav-label">${escapeHtml(group)}</p>${categories.filter(category => category.group === group).map(category => `<button class="nav-item" data-category="${escapeHtml(category.key)}"><span class="nav-icon">${escapeHtml(category.icon)}</span><span class="nav-name">${escapeHtml(category.key)}</span><span class="nav-count">${categoryCount(category.key)}</span></button>`).join('')}</div>`).join('');
}

function filteredProjects() {
  return projects.filter(project => state.category === 'all' || project.category === state.category);
}

function render(reset=true) {
  if (reset) state.visible = PAGE_SIZE;
  const filtered = filteredProjects();
  const visible = filtered.slice(0,state.visible);
  els.grid.innerHTML = visible.map((project,index) => card(project,index)).join('');
  els.empty.style.display = filtered.length ? 'none' : 'block';
  els['load-more'].hidden = visible.length >= filtered.length;
  els['load-more'].textContent = `继续浏览 · 还有 ${Math.max(0,filtered.length-visible.length)} 个`;
}

function card(project,index) {
  const [owner,...nameParts] = project.name.split('/');
  const repoName = nameParts.join('/');
  const topics = project.topics.slice(0,3).map(topic => `<span class="tag">${escapeHtml(topic)}</span>`).join('');
  return `<article class="card" style="animation-delay:${Math.min(index,12)*22}ms">
    <div class="card-top"><span class="rank">RANK / ${String(project.rank).padStart(3,'0')}</span><span class="stars">${formatStars(project.stars)}</span></div>
    <h2 class="repo-title"><a href="${escapeHtml(project.repo)}" target="_blank" rel="noopener"><span class="owner">${escapeHtml(owner)} /</span><span class="repo-name">${escapeHtml(repoName)}</span></a></h2>
    <p class="desc" title="${escapeHtml(project.desc)}">${escapeHtml(project.desc)}</p>
    <div class="tags"><span class="tag lang">${escapeHtml(project.lang)}</span>${project.license ? `<span class="tag">${escapeHtml(project.license)}</span>` : ''}${project.archived ? '<span class="tag archive">已归档</span>' : ''}${topics}</div>
    <div class="card-footer"><div class="category"><b>${escapeHtml(project.category)}</b>${escapeHtml(project.use)}</div><div class="updated">UPDATED<br>${formatDate(project.updated)}</div></div>
  </article>`;
}

function activate(selector,button) { document.querySelectorAll(selector).forEach(item => item.classList.toggle('active',item===button)); }
function bindEvents() {
  els['category-nav'].addEventListener('click',event => { const button=event.target.closest('[data-category]'); if(!button)return; state.category=button.dataset.category; activate('[data-category]',button); render(); document.body.classList.remove('nav-open'); els['mobile-toggle'].setAttribute('aria-expanded','false'); });
  els['load-more'].addEventListener('click',() => { state.visible += PAGE_SIZE; render(false); });
  els['mobile-toggle'].addEventListener('click',() => { const open=document.body.classList.toggle('nav-open'); els['mobile-toggle'].setAttribute('aria-expanded',String(open)); });
  document.addEventListener('keydown',event => { if(event.key==='Escape') document.body.classList.remove('nav-open'); });
  document.addEventListener('click',event => { if(document.body.classList.contains('nav-open') && !event.target.closest('#sidebar') && !event.target.closest('#mobile-toggle')) document.body.classList.remove('nav-open'); });
}

initialize();
</script>
